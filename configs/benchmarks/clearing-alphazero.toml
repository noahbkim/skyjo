# Same frozen evaluator, sampled chance, boundary_samples=1, no root noise.
# Uniform means equal probability per symmetry group at every decision node.
version = 1
iterations = [8192]
seeds = [0, 1, 2, 3]

[[methods]]
name = "alphazero"
[methods.search]
fpu_mode = "zero"
valuation = "mean_return"
target_strategy = "visits"

[[methods]]
name = "alphazero-q"
[methods.search]
fpu_mode = "zero"
valuation = "mean_return"
action_strategy = "value"
target_strategy = "visits"

[[methods]]
name = "alphazero-uniform"
[methods.search]
uniform_group_priors = true
fpu_mode = "zero"
valuation = "mean_return"
target_strategy = "visits"

[[methods]]
name = "alphazero-uniform-q"
[methods.search]
uniform_group_priors = true
fpu_mode = "zero"
valuation = "mean_return"
action_strategy = "value"
target_strategy = "visits"
