name = "baseline-round-score-doubling"
description = "Baseline training budget with raw round-score and doubling auxiliary losses."
tags = ["full-game", "round-score", "doubling"]
notes = "25,600 games with frequent policy updates. Approximately 14 hours at the prior run’s late throughput; game lengths may change. Concept checks are heuristic diagnostics, not playing-strength evaluation."
seed = 0
players = 2

[model]
embedding_dimensions = 16
global_state_embedding_dimensions = 32
num_heads = 2

[training]
batch_size = 256
replay_ratio = 4.0
learn_rate = 0.001
value_scale = 1.0
policy_scale = 1.0
gradient_diagnostic = true

[selfplay]
games_per_iteration = 256
# Small tasks balance variable full-game lengths across the eight workers.
games_per_task = 8
start_state = "standard"

[search]
iterations = 32
dirichlet_epsilon = 0.25
after_state_evaluate_all_children = false
c_puct = 1.0
# A large unvisited-action penalty suppresses exploration with only 32 visits.
fpu_reduction = 0.0
action_softmax_temperature = 1.0

[replay]
# About seven recent batches at 295 decisions/game.
capacity = 524288

[budget]
# Preserve frequent feedback and extend the learning horizon, not search cost.
iterations = 100
checkpoint_interval = 1

[execution]
device = "cpu"
workers = 8
threads_per_worker = 1
debug = false

[logging]
# Completion summary only; set a positive interval for timed progress updates.
progress_interval_seconds = 0.0

[validation]
concept_interval = 5

[auxiliary_objectives]
round_raw_score = 0.1
round_doubled = 0.1

[auxiliary_targets]
mode = "observed"
# Used only when mode is changed to "resampled".
samples = 32
