name = "full-game-baseline"
description = "Full-game win and policy baseline without terminal rollouts."
tags = ["baseline", "full-game"]
notes = "Record the research question, comparison baseline, observations, and limitations here."
seed = 0
players = 2

[model]
type = "equivariant"
embedding_dimensions = 16
global_state_embedding_dimensions = 32
num_heads = 2

[training]
batch_size = 256
replay_ratio = 4.0
learn_rate = 0.001
loss = "base"
value_scale = 1.0
policy_scale = 1.0
round_score_scale = 0.0
future_clear_scale = 0.0
clear_positive_weight = 10.0

[selfplay]
games_per_iteration = 1024
games_per_task = 8
start_state = "standard"

[search]
iterations = 100
dirichlet_epsilon = 0.25
after_state_evaluate_all_children = false
c_puct = 1.0
fpu_reduction = 0.25
score_utility_weight = 0.0
action_softmax_temperature = 1.0

[replay]
capacity = 2000000
targets = "core"

[validation]
enabled = false
interval = 1
value_loss_scale = 1.0
policy_loss_scale = 1.0

[faceoff]
paired_rounds = 0
rounds_per_task = 1
interval = 1

[budget]
iterations = 10
checkpoint_interval = 1

[execution]
device = "cpu"
workers = 8
threads_per_worker = 1
debug = false
