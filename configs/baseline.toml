name = "full-game-baseline"
description = "Full-game win and policy training with 32 search visits per decision."
tags = ["baseline", "full-game"]
seed = 0
players = 2

[model]
embedding_dimensions = 16
global_state_embedding_dimensions = 32
num_heads = 2

[training]
batch_size = 256
replay_ratio = 4.0
learn_rate = 0.001
value_scale = 1.0
policy_scale = 1.0

[selfplay]
games_per_iteration = 256
# Task grouping changes scheduling, not game identities.
games_per_task = 8
start_state = "standard"

[search]
iterations = 32
dirichlet_epsilon = 0.25
after_state_evaluate_all_children = false
c_puct = 1.0
# A large unvisited-action penalty suppresses exploration with only 32 visits.
fpu_reduction = 0.0
action_softmax_temperature = 1.0

[replay]
# Capacity is positions; retention and eviction preserve complete games.
capacity = 524288

[budget]
# 100 iterations × 256 complete games. Measure runtime on the target environment.
iterations = 100
checkpoint_interval = 1

[execution]
device = "cpu"
workers = 1
threads_per_worker = 1
debug = false

[logging]
# Completion summary only; set a positive interval for timed progress updates.
progress_interval_seconds = 0.0

[validation]
concept_interval = 5
