# Extend in configs/local/ and set bootstrap_checkpoint to an early checkpoint.
extends = "baseline.toml"
name = "overnight-group256-early-bootstrap"
description = "Twelve-hour weights-only early bootstrap with fresh group-aware search256 targets."
seed = 20261016

[auxiliary_objectives]
round_raw_score = 1.0
round_doubled = 0.1

[selfplay]
games_per_iteration = 1024
games_per_task = 1
fast_search_iterations = 0
full_search_probability = 1.0

[search]
iterations = 256
c_puct = 1.0
fpu_reduction = 0.0
fpu_mode = "parent"
valuation = "current_mixture"
target_strategy = "visits"
merge_symmetric_actions = true
uniform_group_priors = false
group_root_noise = true
boundary_samples = 1

[replay]
capacity = 1048576

[budget]
iterations = 0
max_seconds = 43200.0
checkpoint_interval = 1

[execution]
workers = 8
threads_per_worker = 1

[logging]
progress_interval_seconds = 60.0

[validation]
concept_interval = 5
