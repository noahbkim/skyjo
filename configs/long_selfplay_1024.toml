extends = "round_score_weight_1.toml"
name = "long-selfplay-1024"
description = "40,960-game trajectory to measure whether continued fresh self-play improves checkpoint strength."
notes = "Single-seed exploratory trajectory. Inspect iterations 10, 20, 30, and 40 (10,240; 20,480; 30,720; 40,960 games). Compare these against the previous 10,496-game checkpoint, and compare the final model against this run's iteration 20. Evaluation is a separate step, not launched by this configuration. Keep search, replay ratio, model size, and loss weights fixed throughout. Score and clearing trends are behavioral diagnostics, not substitutes for full-game wins. Historical comparisons also differ in loss weight and model-refresh cadence; use within-run comparisons to assess later progress."

[selfplay]
games_per_iteration = 1024

[budget]
iterations = 40
checkpoint_interval = 1
